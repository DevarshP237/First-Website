<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="100" cy="100" r="94" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#sealShadow)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- University Circular Text Path -->
  <path id="textCircleTop" d="M 30,100 A 70,70 0 1,1 170,100" fill="none" />
  <path id="textCircleBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />

  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc" letter-spacing="2.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      UNIVERSITY OF TECHNOLOGY
    </textPath>
  </text>

  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#fbbf24" letter-spacing="3">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      • EST. 1888 •
    </textPath>
  </text>

  <!-- Laurel Wreath Leaves (Left) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M 40,82 C 37,86 34,92 36,96 C 37,92 41,88 40,82 Z" />
    <path d="M 38,98 C 36,102 34,108 37,112 C 38,107 41,104 38,98 Z" />
    <path d="M 42,114 C 41,118 40,123 44,126 C 45,122 47,118 42,114 Z" />
    <path d="M 49,127 C 50,132 50,137 54,139 C 55,135 55,130 49,127 Z" />
  </g>

  <!-- Laurel Wreath Leaves (Right) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M 160,82 C 163,86 166,92 164,96 C 163,92 159,88 160,82 Z" />
    <path d="M 162,98 C 164,102 166,108 163,112 C 162,107 159,104 162,98 Z" />
    <path d="M 158,114 C 159,118 160,123 156,126 C 155,122 153,118 158,114 Z" />
    <path d="M 151,127 C 150,132 150,137 146,139 C 145,135 145,130 151,127 Z" />
  </g>

  <!-- Central Academic Shield -->
  <g transform="translate(100, 103)">
    <!-- Shield Base -->
    <path d="M -30,-34 L 30,-34 Q 30,12 0,38 Q -30,12 -30,-34 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Shield Cross Divider -->
    <line x1="-30" y1="-8" x2="30" y2="-8" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-34" x2="0" y2="38" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

    <!-- Open Book of Knowledge (Top Left) -->
    <g transform="translate(-15, -20) scale(0.65)" stroke="#ffffff" fill="none" stroke-width="2">
      <path d="M -12,8 Q -6,4 0,6 Q 6,4 12,8 L 12,-6 Q 6,-10 0,-8 Q -6,-10 -12,-6 Z" fill="#ffffff" opacity="0.9"/>
      <line x1="0" y1="-8" x2="0" y2="6" stroke="#2563eb" stroke-width="2"/>
    </g>

    <!-- Torch of Wisdom / Enlightenment (Top Right) -->
    <g transform="translate(15, -20) scale(0.7)">
      <!-- Flame -->
      <path d="M 0,-12 Q 4,-6 0,0 Q -4,-6 0,-12 Z" fill="#f59e0b" />
      <path d="M 0,-10 Q 2,-6 0,-2 Q -2,-6 0,-10 Z" fill="#fef08a" />
      <!-- Handle -->
      <path d="M -3,0 L 3,0 L 1.5,10 L -1.5,10 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Computing / Binary Gear / Atom (Bottom Center) -->
    <g transform="translate(0, 14) scale(0.75)">
      <!-- Binary/Atom Orbit -->
      <ellipse cx="0" cy="0" rx="14" ry="5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" transform="rotate(30)"/>
      <ellipse cx="0" cy="0" rx="14" ry="5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" transform="rotate(-30)"/>
      <circle cx="0" cy="0" r="3.5" fill="#f59e0b" />
    </g>
  </g>

  <!-- Stars of Excellence -->
  <g fill="url(#goldGrad)">
    <polygon points="100,20 102,25 107,25 103,28 105,33 100,30 95,33 97,28 93,25 98,25" transform="scale(0.8) translate(25, 6)"/>
  </g>
</svg>
