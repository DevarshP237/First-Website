<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="100%" height="100%">
  <!-- Graduation Cap Icon -->
  <g transform="translate(6, 6) scale(0.65)">
    <!-- Blue Glow / Soft Square -->
    <rect x="0" y="0" width="76" height="76" rx="18" fill="#2563eb" />
    
    <!-- White Mortarboard Diamond -->
    <polygon points="38,18 68,30 38,42 8,30" fill="#ffffff"/>
    
    <!-- Underside Cap -->
    <path d="M 20,35 L 20,44 C 20,53 56,53 56,44 L 56,35" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Center Button -->
    <circle cx="38" cy="30" r="3" fill="#2563eb"/>
    
    <!-- Tassel Ribbon & Brush -->
    <path d="M 38,30 C 54,32 64,40 64,48 L 64,56" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="62" y="55" width="4" height="6" rx="2" fill="#ffffff"/>
  </g>

  <!-- Typography: CampusLearn -->
  <text x="66" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">
    Campus<tspan fill="#2563eb">Learn</tspan>
  </text>
  
  <!-- Subtitle: Learn · Build · Grow -->
  <text x="67" y="49" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1.2">
    Learn &bull; Build &bull; Grow
  </text>
</svg>
