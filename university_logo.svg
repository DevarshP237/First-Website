<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <!-- Crest Icon on Left -->
  <g transform="translate(40, 40) scale(0.36)">
    <!-- Base Shield -->
    <circle cx="0" cy="0" r="90" fill="#1e3a8a" stroke="#d97706" stroke-width="4"/>
    <circle cx="0" cy="0" r="76" fill="#1d4ed8" stroke="#fbbf24" stroke-width="2"/>
    <!-- Cross Divider -->
    <line x1="-76" y1="0" x2="76" y2="0" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-76" x2="0" y2="76" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
    <!-- Book -->
    <path d="M -45,-35 Q -25,-45 0,-40 Q 25,-45 45,-35 L 45,-15 Q 25,-25 0,-20 Q -25,-25 -45,-15 Z" fill="#ffffff"/>
    <circle cx="0" cy="35" r="18" fill="#f59e0b"/>
    <!-- Graduation Cap on Crest -->
    <polygon points="0,-12 30,-2 0,8 -30,-2" fill="#f8fafc"/>
  </g>

  <!-- Typography on Right -->
  <text x="85" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="currentColor" letter-spacing="1">
    UNIVERSITY OF TECHNOLOGY
  </text>
  <text x="85" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#2563eb" letter-spacing="1.5">
    DEPARTMENT OF COMPUTER SCIENCE &amp; ENGINEERING
  </text>
  <text x="85" y="65" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    Accredited Academic Partner &bull; Est. 1888
  </text>
</svg>
